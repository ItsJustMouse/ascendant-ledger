name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Prepare embedded server runtime
        working-directory: desktop
        shell: bash
        run: node scripts/prepare-runtime.mjs --arch=${{ matrix.arch }}

      - name: Run desktop checks
        working-directory: desktop
        run: npm run check

      - name: Build Windows installer
        if: matrix.platform == 'win'
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npx electron-builder --linux --x64 --publish never

      - name: Build macOS Apple Silicon
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Build macOS Intel
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --publish never

      - name: Collect installer artifacts
        shell: bash
        working-directory: desktop
        run: |
          rm -rf upload
          mkdir -p upload
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -exec cp {} upload/ \;
          echo "Artifacts:"
          ls -lh upload

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ascendant-ledger-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/upload/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Ascendant Ledger ${GITHUB_REF_NAME}" --generate-notes
          fi
          find artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
