<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ascendant Ledger</title>

    h1{font-size:30px;margin:0 0 8px}.sub{color:#9bb0bc;margin:0 0 26px}.loader{width:240px;height:4px;border-radius:99px;background:#18262d;overflow:hidden;margin:auto}.loader:after{content:"";display:block;width:40%;height:100%;background:#65dbc6;border-radius:99px;animation:move 1.1s ease-in-out infinite alternate}.copy{margin-top:28px;color:#647884;font-size:12px}@keyframes move{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
  </style>
</head>
<body><main class="wrap"><div class="mark">A</div><h1>Ascendant Ledger</h1><p class="sub">Starting your private company ledger…</p><div class="loader"></div><p class="copy">Created by NullBot | Copyright 2026</p></main></body>
